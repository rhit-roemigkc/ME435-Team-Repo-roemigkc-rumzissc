<html lang="en">
<head>
    <link rel="stylesheet" href="main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatroom</title>

</head>
<body>

<div class="container">
    <div class="header"><h2>Chat Room</h2></div>
    <div class="menu">
        <input type="text" value="" id="username" size="40">
        <button id="logIn">Log In</button>
        <br><br>
        <label for="avatar">Choose a profile picture:</label>

        <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg" />
    </div>
    <div class="content">
        <span id="replyTime"></span>
        <b><span id="replyUsername"></span></b>
        <span id="replyText"></span>
        
    </div>
    <div class="footer">
        <input type="text" value="" id="chatBox" size="80">
        <button id="send">Send Message</button>
        &emsp; &emsp;
        <label for="uploadImage">Upload Image:</label>
        <input type="file" id="uploadImage" name="uploadImage" accept="image/png, image/jpeg" />
    </div>
</div>

    <script src="main.js"></script>
</body>
</html>
